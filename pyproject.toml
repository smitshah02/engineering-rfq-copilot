
[project]
name = "engineering-rfq-copilot"
version = "0.1.0"
description = "Engineering RFQ Multi-Agent Copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "jsonschema>=4,<5",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0.22,<3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rfq_copilot"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short"
markers = [
    "integration: requires authenticated PostgreSQL development/test connections",
]
